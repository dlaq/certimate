name: Publish gemini-api2cli Docker image

on:
  push:
    branches:
      - gemini-api2cli-build-trigger
  workflow_dispatch:

# Uses Docker Hub credentials already stored in this repository.
jobs:
  publish:
    uses: dlaq/gemini-api2cli/.github/workflows/docker-publish.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
